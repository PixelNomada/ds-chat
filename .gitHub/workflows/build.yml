name: Build DS Chat

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with BlocksDS
        run: |
          docker run --rm -v ${{ github.workspace }}:/work \
            -w /work \
            skylyrac/blocksds:slim-latest \
            make

      - name: Upload .nds
        uses: actions/upload-artifact@v4
        with:
          name: ds-chat
          path: |
            *.nds
          if-no-files-found: error
